<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the theme before first paint to avoid a flash. Stored choice wins,
      // otherwise default to light.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <title>AUVERTIME — Agence digitale : développement web, acquisition & stratégie</title>
    <meta
      name="description"
      content="AUVERTIME, agence digitale spécialisée dans le développement web, l'acquisition publicitaire et la stratégie digitale. Des expériences digitales performantes pour développer votre activité."
    />
    <meta name="theme-color" content="#f6f8f7" />
    <meta property="og:title" content="AUVERTIME — Agence digitale" />
    <meta
      property="og:description"
      content="Développement web, acquisition publicitaire et stratégie digitale. Donnez une nouvelle dimension à votre présence digitale."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded non-render-blocking: media="print" lets the browser fetch it
      without waiting to paint, then onload switches it to "all". Without
      this, the whole page (not just the fonts) stalls on this third-party
      request before showing anything — very noticeable on mobile networks.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
